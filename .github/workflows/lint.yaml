name: lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/fsx
    steps:
      - uses: actions/checkout@v4

      # Pinned so formatting can't change under us; keep in step with the
      # version used locally. .clang-format needs 18+ (SkipMacroDefinitionBody).
      - name: Install clang-format
        run: pip install 'clang-format==23.1.3'

      - name: Check formatting
        run: make lint
