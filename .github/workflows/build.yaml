name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  fsx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/fsx
    steps:
      - uses: actions/checkout@v4

      - name: Install Check
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install check pkgconf
          else
            sudo apt-get update
            sudo apt-get install -y check pkg-config
          fi

      - name: Build
        run: make

      - name: Unit tests
        run: make check

      - name: Smoke test
        run: |
          fsx="$PWD/fsx"
          cd "$RUNNER_TEMP"
          "$fsx" -q -N 10000 -S 1 fsx-smoke
          "$fsx" -q -H -N 10000 -S 1 fsx-smoke-holes
          "$fsx" -q -A -N 10000 -S 1 fsx-smoke-falloc
          "$fsx" -q -A -N 10000 -S 2 fsx-smoke-falloc2
          "$fsx" -q -A -H -N 10000 -S 3 fsx-smoke-falloc-holes
